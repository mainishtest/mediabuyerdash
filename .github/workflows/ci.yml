name: CI

on:
  push:
    branches:
      - main
      - MediaBuying_main
  pull_request:
    branches:
      - main
      - MediaBuying_main

jobs:
  ci:
    name: Lint, Type-check, Build
    runs-on: ubuntu-latest

    env:
      # Required for prisma generate (postinstall) and next build.
      # SQLite path — no real database needed for type/lint/build checks.
      DATABASE_URL: "file:./ci.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # No package-lock.json in this repo — use npm install.
      # Switch to `npm ci` once a lockfile is committed.
      - name: Install dependencies
        run: npm install

      - name: Apply database schema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
